# Render Blueprint for the DammyRex API.
# Render dashboard → New → Blueprint → pick this repo. Values marked sync:false are asked for once.
# NOTE: the live service (https://dammyrex-declutter-web.onrender.com) was created by hand in the
# dashboard, so it does NOT read this file. Keep it as the recipe for recreating the service.
services:
  - type: web
    name: dammyrex-declutter-web
    runtime: node
    plan: free
    region: frankfurt # same AWS region as the Neon database
    rootDir: api
    # --include=dev: the Nest CLI/TypeScript/Prisma CLI are devDependencies but needed to build.
    # Migrations run in the build because the free plan has no pre-deploy step.
    buildCommand: npm ci --include=dev && npm run build && node scripts/check-env.js && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /ping
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.19.5
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: WHATSAPP_NUMBER
        sync: false
      # Set to the Vercel URL once the website is deployed, e.g. https://dammyrex-declutter.vercel.app
      - key: WEB_ORIGIN
        sync: false
